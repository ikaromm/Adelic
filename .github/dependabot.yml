# Weekly dependency updates as pull requests to develop; CI runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # Low-risk updates together; majors stay separate so each is reviewed on its own.
      minor-and-patch:
        update-types: [minor, patch]
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*', 'prettier', 'globals']
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer: typescript <6.1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
