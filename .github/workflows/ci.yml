name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same major as the development machine; package.json requires >=22.13.
          node-version: 26
          cache: npm

      # The approval policy only auto-approves real binaries under /usr/bin or /bin, and
      # its tests use rg and pactl; install them instead of weakening the policy tests.
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap ripgrep pulseaudio-utils
          for tool in bwrap rg pactl; do readlink -f "$(command -v "$tool")"; done
          # Real bubblewrap tests need unprivileged user namespaces, which Ubuntu 24.04
          # restricts through AppArmor; relax it on this ephemeral runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bubblewrap ok"

      - name: Install dependencies
        run: npm ci
        env:
          # Packaging is not part of CI; skip the Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test (with coverage floor for server/ and shared/)
        run: npm run coverage

      - name: Build
        run: npm run build

  # Adelic's ai-memory client against every supported ai-memory release. Checksums are
  # pinned here (copied from each release's .sha256), not fetched with the archive.
  ai-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.1.0
            sha256: b4d911f392fea7f151c9c1ff83521922417570e5104ffb02a5e82253afc877ac
          - version: 2.5.2
            sha256: acbf6ee84e744a9ab0a8e133a3eefbbb77811d6b4d0ca9a281e664358c1a1fc8
    name: ai-memory ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install ai-memory ${{ matrix.version }}
        run: |
          curl -fsSL -o /tmp/ai-memory.tgz "https://github.com/akitaonrails/ai-memory/releases/download/v${{ matrix.version }}/ai-memory-linux-x86_64.tar.gz"
          echo "${{ matrix.sha256 }}  /tmp/ai-memory.tgz" | sha256sum -c -
          mkdir -p /tmp/ai-memory && tar xzf /tmp/ai-memory.tgz -C /tmp/ai-memory ./ai-memory
          /tmp/ai-memory/ai-memory --version

      - name: Integration tests
        run: npx vitest run tests/integration-ai-memory.test.ts
        env:
          AI_MEMORY_BIN: /tmp/ai-memory/ai-memory

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (scripted provider, temporary data)
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Same packaging and headless smoke test the Release workflow runs before publishing,
  # so a broken AppImage shows up on develop instead of at release time.
  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2t64 xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build AppImage
        run: npm run package:linux

      - name: Smoke test the AppImage (headless X11)
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' npm run desktop:smoke

      - name: Keep the AppImage for the distribution matrix
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Adelic-*-linux-x86_64.AppImage
          retention-days: 2

  # Opens the same AppImage on other distributions (headless X11). Only the smoke script and
  # Node (official tarball, pinned checksum) are added to each image; no Adelic dependencies.
  distros:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            setup: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth xz-utils curl ca-certificates libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libsecret-1-0 >/dev/null
          - name: Debian 12
            image: debian:12
            setup: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth xz-utils curl ca-certificates libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libsecret-1-0 >/dev/null
          - name: Fedora 42
            image: fedora:42
            setup: dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth xz curl gtk3 nss alsa-lib mesa-libgbm libXScrnSaver libXtst at-spi2-atk libdrm libsecret which procps-ng >/dev/null
    name: AppImage on ${{ matrix.name }}
    container:
      image: ${{ matrix.image }}
      # Electron's sandbox needs user namespaces inside the container.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/smoke-desktop.mjs
            package.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: release

      - name: System libraries
        run: ${{ matrix.setup }}

      - name: Node.js 24 (official tarball)
        run: |
          curl -fsSL -o /tmp/node.tar.xz https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
          echo "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  /tmp/node.tar.xz" | sha256sum -c -
          mkdir -p /opt/node && tar xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          echo /opt/node/bin >> "$GITHUB_PATH"

      - name: Smoke test
        run: |
          chmod +x release/Adelic-*-linux-x86_64.AppImage
          useradd -m tester
          chown -R tester release scripts package.json
          # The smoke script prints the app's stderr on failure; keep a copy as an artifact too.
          su tester -c "PATH=/opt/node/bin:\$PATH xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' node scripts/smoke-desktop.mjs \$(ls release/Adelic-*-linux-x86_64.AppImage)" 2>&1 | tee smoke.log
          status="${PIPESTATUS[0]}"
          # Surface the failure in the run's annotations (readable without signing in).
          if [ "$status" != 0 ]; then echo "::error title=AppImage smoke ($(. /etc/os-release; echo "$PRETTY_NAME"))::$(tail -c 900 smoke.log | tr '\n' ' ')"; fi
          exit "$status"
        shell: bash

      - name: Smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ strategy.job-index }}
          path: smoke.log
          retention-days: 3
