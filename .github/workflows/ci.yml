name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same major as the development machine; package.json requires >=22.13.
          node-version: 26
          cache: npm

      # The approval policy only auto-approves real binaries under /usr/bin or /bin, and
      # its tests use rg and pactl; install them instead of weakening the policy tests.
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap ripgrep pulseaudio-utils
          for tool in bwrap rg pactl; do readlink -f "$(command -v "$tool")"; done
          # Real bubblewrap tests need unprivileged user namespaces, which Ubuntu 24.04
          # restricts through AppArmor; relax it on this ephemeral runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bubblewrap ok"

      - name: Install dependencies
        run: npm ci
        env:
          # Packaging is not part of CI; skip the Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Real ai-memory for tests/integration-ai-memory.test.ts, pinned to the version
      # this project validates against; the checksum is pinned here, not fetched.
      - name: Install ai-memory 2.1.0
        run: |
          curl -fsSL -o /tmp/ai-memory.tgz https://github.com/akitaonrails/ai-memory/releases/download/v2.1.0/ai-memory-linux-x86_64.tar.gz
          echo "b4d911f392fea7f151c9c1ff83521922417570e5104ffb02a5e82253afc877ac  /tmp/ai-memory.tgz" | sha256sum -c -
          mkdir -p /tmp/ai-memory && tar xzf /tmp/ai-memory.tgz -C /tmp/ai-memory ./ai-memory
          echo "AI_MEMORY_BIN=/tmp/ai-memory/ai-memory" >> "$GITHUB_ENV"
          /tmp/ai-memory/ai-memory --version

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (scripted provider, temporary data)
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
