name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same major as the development machine; package.json requires >=22.13.
          node-version: 26
          cache: npm

      # The approval policy only auto-approves real binaries under /usr/bin or /bin, and
      # its tests use rg and pactl; install them instead of weakening the policy tests.
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap ripgrep pulseaudio-utils
          for tool in bwrap rg pactl; do readlink -f "$(command -v "$tool")"; done
          # Real bubblewrap tests need unprivileged user namespaces, which Ubuntu 24.04
          # restricts through AppArmor; relax it on this ephemeral runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bubblewrap ok"

      - name: Install dependencies
        run: npm ci
        env:
          # Packaging is not part of CI; skip the Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Adelic's ai-memory client against every supported ai-memory release. Checksums are
  # pinned here (copied from each release's .sha256), not fetched with the archive.
  ai-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.1.0
            sha256: b4d911f392fea7f151c9c1ff83521922417570e5104ffb02a5e82253afc877ac
          - version: 2.5.2
            sha256: acbf6ee84e744a9ab0a8e133a3eefbbb77811d6b4d0ca9a281e664358c1a1fc8
    name: ai-memory ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install ai-memory ${{ matrix.version }}
        run: |
          curl -fsSL -o /tmp/ai-memory.tgz "https://github.com/akitaonrails/ai-memory/releases/download/v${{ matrix.version }}/ai-memory-linux-x86_64.tar.gz"
          echo "${{ matrix.sha256 }}  /tmp/ai-memory.tgz" | sha256sum -c -
          mkdir -p /tmp/ai-memory && tar xzf /tmp/ai-memory.tgz -C /tmp/ai-memory ./ai-memory
          /tmp/ai-memory/ai-memory --version

      - name: Integration tests
        run: npx vitest run tests/integration-ai-memory.test.ts
        env:
          AI_MEMORY_BIN: /tmp/ai-memory/ai-memory

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (scripted provider, temporary data)
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
