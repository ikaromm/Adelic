<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1015" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/pwa/offline.css" />
    <title>Sem conexão com o Adelic</title>
  </head>
  <body>
    <!-- Served by the service worker when a page load fails (docs/specs/pwa.md). No script. -->
    <main class="offline" aria-labelledby="offline-title">
      <img src="/favicon.svg" width="56" height="56" alt="" />
      <h1 id="offline-title">Sem conexão com o Adelic</h1>
      <p>
        Não foi possível falar com o computador onde o Adelic está rodando. Confira se ele está ligado, com o Adelic
        aberto, e se este aparelho está na mesma rede (por exemplo, conectado à Tailscale).
      </p>
      <a class="offline-retry" href="/">Tentar de novo</a>
    </main>
  </body>
</html>
